name: Fetch APK

# The GitHub API rejects files this large via the contents/blob endpoints,
# and git push cannot use the fine-grained PAT from outside GitHub.
# This workflow downloads the APK from a temporary direct link and commits
# it to the repo using the workflow's own GITHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct URL of the APK to publish"
        required: true
        default: "https://muse.ai/files/1395046743701396/1107019042293110/rbvq085ibpznfdc83far1tuv/StarDash-NineWorlds-1.0.22.apk"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        run: |
          curl -L -o StarDash-NineWorlds-1.0.22.apk "${{ inputs.apk_url }}"
          echo "f32a91a5cac33a6e0f5b6bf0066c31f24477f889b9d141246c9ece579607f5e2  StarDash-NineWorlds-1.0.22.apk" | sha256sum -c -
          ls -l StarDash-NineWorlds-1.0.22.apk
      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add StarDash-NineWorlds-1.0.22.apk
          git commit -m "Publish Star Dash: Nine Worlds 1.0.22 APK (versionCode 23)" || echo "nothing to commit"
          git push
